[bootstrap.brew]
adopt = true

[bootstrap.packages]
# Fedora/RHEL
"dnf:zsh" = "latest"

"brew:findutils" = "latest"
"brew:git" = "latest"
"brew:gnu-getopt" = "latest"
"brew:sequoia-sq" = "latest"
"brew:tree-sitter" = "latest"
"brew:tree-sitter-cli" = "latest"

# MacOS
"brew-cask:1password" = { os = "macos" }
"brew-cask:1password-cli" = { os = "macos" }
"brew-cask:discord" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:keymapp" = { os = "macos" }
"brew-cask:raycast" = { os = "macos" }
"brew-cask:spotify" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }

[bootstrap.services.colima]
scope = "user"
command = "colima start -f"
restart = "on-failure"
enabled = true
